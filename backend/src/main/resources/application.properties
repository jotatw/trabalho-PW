# ============================================================
# APLICAÇÃO
# ============================================================

quarkus.application.name=trabalho-pw

# ============================================================
# BANCO DE DADOS - POSTGRESQL
# ============================================================

quarkus.datasource.db-kind=postgresql

quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# ============================================================
# HIBERNATE ORM + PANACHE
# ============================================================

# O Hibernate apenas valida a estrutura existente.
# A criação e alteração do banco serão controladas por scripts SQL.
quarkus.hibernate-orm.schema-management.strategy=validate

# Não carregar scripts SQL automaticamente.
quarkus.hibernate-orm.sql-load-script=no-file

# ============================================================
# REST
# ============================================================

quarkus.http.port=8080

# ============================================================
# JWT
# ============================================================

# JWT - validação
mp.jwt.verify.publickey.location=${user.home}/.config/trabalho-pw/jwt/publicKey.pem
mp.jwt.verify.issuer=trabalho-pw

# JWT - assinatura
smallrye.jwt.sign.key.location=${user.home}/.config/trabalho-pw/jwt/privateKey.pem
