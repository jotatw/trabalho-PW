le-container"><table><thead><tr><th>Cliente</th><th>Categoria</th><th>Período</th><th>Status</th><th>Ações</th></tr></thead><tbody id="reservas-lista"><tr><td colspan="5">Carregando...</td></tr></tbody></table></div></section></main></div><script src="/js/api.js"></script><script src="/js/layout.js"></script><script src="/js/reservas.js"></script><script>carregarLayout('reservas'); iniciarReservas();</script></body></html>
