<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuários - Locadora</title>

    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">

    <link rel="stylesheet" href="/css/layout/app.css">
    <link rel="stylesheet" href="/css/layout/sidebar.css">
    <link rel="stylesheet" href="/css/layout/topbar.css">

    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/tables.css">

    <link rel="stylesheet" href="/css/pages/usuarios.css">
</head>

<body>

<div class="app" id="app-layout">

    <main class="main-content">

        <header class="topbar">

            <div>
                <h2>Usuários</h2>
                <p>Gerenciamento de usuários do sistema</p>
            </div>

            <div class="user-info">
                <span id="user-name">Usuário</span>
            </div>

        </header>

        <section class="page-content">

            <div class="page-header">

                <div>
                    <h3>Usuários cadastrados</h3>
                    <p>Visualize e gerencie os usuários registrados no sistema.</p>
                </div>

                <button id="novo-usuario-button" class="button-primary">
                    Novo usuário
                </button>

            </div>

            <div id="usuario-form-container" class="form-container hidden">

                <form id="usuario-form">

                    <div class="form-header">
                        <h3>Novo usuário</h3>
                        <button type="button" id="cancelar-usuario-button">
                            Cancelar
                        </button>
                    </div>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="nome">
                                Nome
                            </label>

                            <input
                                    type="text"
                                    id="nome"
                                    name="nome"
                                    required
                                    maxlength="100"
                            >

                        </div>

                        <div class="form-group">

                            <label for="email">
                                E-mail
                            </label>

                            <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                    maxlength="150"
                            >

                        </div>

                        <div class="form-group">

                            <label for="senha">
                                Senha
                            </label>

                            <input
                                    type="password"
                                    id="senha"
                                    name="senha"
                                    required
                            >

                        </div>

                        <div class="form-group">
                            <label for="perfilId">
                                Perfil
                            </label>

                            <select id="perfilId" name="perfilId" required>
                                <option value="">Carregando perfis...</option>
                            </select>
                        </div>

                    </div>

                    <div id="usuario-form-mensagem"></div>

                    <button type="submit" class="button-primary">
                        Cadastrar usuário
                    </button>

                </form>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody id="usuarios-lista">
                    <tr>
                        <td colspan="5">
                            Carregando usuários...
                        </td>
                    </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="../js/layout.js"></script>
<script src="../js/usuarios.js"></script>

<script>
    carregarLayout("usuarios");
    carregarUsuarios();
    configurarFormularioUsuario()
    carregarPerfis()
</script>

</body>
</html>
