<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Locadora de Veículos</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages/login.css">
</head>

<body>

<main class="login-container">

    <section class="login-brand" aria-label="Locadora">
        <div class="brand-mark">L</div>
        <span class="brand-kicker">GESTÃO DE FROTAS</span>
        <h2>Mobilidade organizada.<br>Gestão mais simples.</h2>
        <p>Acesse o painel da sua locadora para acompanhar a operação em um só lugar.</p>
        <div class="brand-road" aria-hidden="true"><span></span></div>
    </section>

    <section class="login-card">

        <header class="login-header">
            <h1>Locadora de Veículos</h1>
            <p>Entre com suas credenciais para continuar.</p>
        </header>

        <form id="login-form">

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                        autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                >
            </div>

            <button type="submit">
                Entrar
            </button>

            <p id="login-message" class="login-message"></p>

        </form>

    </section>

</main>

<script src="/js/app.js"></script>

</body>
</html>
